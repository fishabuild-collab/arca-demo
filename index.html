<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arca · Deal room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <style>#invite-link, #btn-invite, #live-label { display: none !important; }</style>
</head>
<body>
  <div id="console">
    <header class="topbar">
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 17V10a7 7 0 0 1 14 0v7" stroke="currentColor" stroke-width="1.5"/><path d="M7 17v-6a3 3 0 0 1 6 0v6" stroke="currentColor" stroke-width="1.5"/></svg>
        <span>Arca</span>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="dealroom" role="tab">Deal room</button>
        <button class="tab" data-tab="extraction" role="tab">Extraction <span class="count" id="extraction-count"></span></button>
        <button class="tab" data-tab="market" role="tab">Market</button>
        <button class="tab" data-tab="security" role="tab">Security</button>
      </nav>
      <div class="topbar-right">
        <span class="crumb" id="crumb">Tai Wai › Flat C, Tower 8B</span>
        <a href="#" class="link" id="invite-link">Invite</a>
        <span id="live-label"></span>
        <div class="user-menu">
          <button class="avatar" id="avatar" aria-haspopup="true" title="Switch role">AL</button>
          <div class="dropdown" id="role-menu" hidden></div>
        </div>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main">
        <section id="tab-dealroom" class="tab-panel active"></section>
        <section id="tab-extraction" class="tab-panel"></section>
        <section id="tab-market" class="tab-panel"></section>
        <section id="tab-security" class="tab-panel"></section>
        <footer class="footnote">Static demo: no server, no AI connection, all results cached · mock documents, fictional parties · market figures from public 2026 press reports</footer>
      </main>
      <aside id="audit-feed" class="activity"></aside>
    </div>
  </div>

  <div id="doc-viewer" style="display:none"></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="static.js"></script>
  <script src="app.js"></script>
  <script src="viewer.js"></script>
  <script src="market.js"></script>
  <script src="security.js"></script>
</body>
</html>
